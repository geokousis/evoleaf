events {}

http {
    # 127.0.0.11 is the DNS server running in Docker. It can resolve the docker compose service name "sharelatex" to a container IP.
    # https://github.com/docker/docs/issues/20532
    resolver 127.0.0.11 ipv6=off valid=10s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    upstream sharelatex {
      zone dns 64k;
      server sharelatex:80 resolve;
    }

    server {
        listen 80 default_server;
        server_name _;

        server_tokens off;

        client_max_body_size 50M;

        location = /app {
            return 301 /app/;
        }

        location /app/ {
            auth_basic "EvoLeaf Access";
            auth_basic_user_file /etc/nginx/overleaf.htpasswd;
            alias /usr/share/nginx/html/app/;
            index index.html;
            try_files $uri $uri/ /app/index.html;
        }

        location = /manifest.webmanifest {
            auth_basic "EvoLeaf Access";
            auth_basic_user_file /etc/nginx/overleaf.htpasswd;
            alias /usr/share/nginx/html/app/manifest.webmanifest;
            default_type application/manifest+json;
        }

        location = /sw.js {
            auth_basic "EvoLeaf Access";
            auth_basic_user_file /etc/nginx/overleaf.htpasswd;
            alias /usr/share/nginx/html/app/sw.js;
            add_header Cache-Control "no-cache";
        }

        location / {
            auth_basic "EvoLeaf Access";
            auth_basic_user_file /etc/nginx/overleaf.htpasswd;
            proxy_pass http://sharelatex;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Ssl on;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3m;
            proxy_send_timeout 3m;
        }
    }
}
