<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeX Package Installer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="background-glow"></div>
    <main class="container">
      <header class="header-card">
        <div class="brand-pill">Overleaf Toolkit Utility</div>
        <h1>TeX Live Package Installer</h1>
        <p>
          Install packages in the <code>sharelatex</code> container. Enter one or more
          package names separated by commas.
        </p>
      </header>

      <section class="panel form-panel">
        <label for="packages">Package Names</label>
        <textarea
          id="packages"
          placeholder="babel-greek, cbfonts, greek-inputenc"
          rows="3"
        ></textarea>
        <div class="actions">
          <button id="install-btn" type="button">Install Packages</button>
          <span id="status-line">Idle</span>
        </div>
      </section>

      <section class="panel progress-panel" id="progress-panel" hidden>
        <div class="progress-head">
          <h2>Job Progress</h2>
          <span id="job-state" class="pill">queued</span>
        </div>
        <div class="progress-bar-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-meta" class="progress-meta">0 / 0 complete</div>

        <div id="package-list" class="package-list"></div>
      </section>

      <section class="panel log-panel" id="log-panel" hidden>
        <div class="progress-head">
          <h2>Job Log</h2>
        </div>
        <pre id="log-output"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
